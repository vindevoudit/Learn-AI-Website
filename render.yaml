# Render Blueprint. With this file committed, Render can configure the whole
# site itself — see the hosting section of the README.
services:
  - type: web
    name: learn-ai
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false

    envVars:
      # Vite 5 needs Node 18+. Pinning keeps the deploy build identical to local.
      - key: NODE_VERSION
        value: 22.21.0

    routes:
      # The site does its own routing, so every unknown path must be handed to
      # index.html. Without this, refreshing on /lessons/next-word returns 404.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Asset filenames contain a content hash, so they can be cached forever.
      # index.html deliberately is not listed — it must stay fresh to pick up
      # new asset names after a deploy.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
